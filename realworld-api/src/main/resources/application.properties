quarkus.http.port=8080

# JWT Configuration
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://realworld.dev
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.token.expiry=PT5M

# MongoDB Dev Services
quarkus.mongodb.devservices.enabled=true
quarkus.mongodb.database=realworld
# JNoSQL document database name (required for repository injection)
jnosql.document.database=realworld
